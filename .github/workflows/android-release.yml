name: Build And Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          latest_tag="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"

          if [[ -z "${latest_tag}" ]]; then
            next_version="1.0.0"
          elif [[ "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next_version="${major}.${minor}.$((patch + 1))"
          else
            echo "Latest tag '${latest_tag}' is not in vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${next_version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PreleaseVersionName="${{ steps.version.outputs.version }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "SerialStressStrain-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: SerialStressStrain-${{ steps.version.outputs.version }}.apk
